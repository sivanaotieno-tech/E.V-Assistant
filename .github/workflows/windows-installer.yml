name: Build E.V. Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Create Python environment
        shell: pwsh
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt
          .\.venv\Scripts\python.exe -m pip install "pyinstaller>=6,<7"

      - name: Build backend
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m PyInstaller --clean --onefile --name ev-backend --paths backend backend\server.py
          New-Item -ItemType Directory -Force -Path backend\dist | Out-Null
          Copy-Item dist\ev-backend.exe backend\dist\ev-backend.exe -Force

      - name: Build frontend and NSIS installer
        run: npm run tauri -- build --bundles nsis --no-sign

      - name: Collect installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\dist | Out-Null
          $setup = Get-ChildItem src-tauri\target\release\bundle\nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'NSIS setup.exe was not produced.' }
          Copy-Item $setup.FullName installer\dist\$($setup.Name) -Force
          Get-FileHash installer\dist\$($setup.Name) -Algorithm SHA256 | Format-List

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: EV-Windows-Installer
          path: installer/dist/*-setup.exe
